      .box {

        height: 80px;
        border-radius: 8px;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
        cursor: pointer;

      #box-a {
        left: 60px;
        top: 60px;
        background: #2f6fd6;
      }
      #box-b {
        left: 300px;
        top: 180px;
        background: #2fa46a;
      }
      #box-c {
        left: 120px;
        top: 320px;
        background: #b34f2f;
      }
      .box:hover {
        filter: brightness(1.2);
      }
      .box.pressed {
        outline: 3px solid #000;
      }
      #spacer {
        height: 1600px;
        background: linear-gradient(#eee, #ccc);
      }
      #log-count {
        position: fixed;
        left: 8px;
        top: 8px;
        background: #000;
        color: #fff;
        padding: 4px 8px;
        border-radius: 4px;
        z-index: 5;
      }
      /* Real form widgets: their state only changes if the browser performs the

        left: 620px;
        top: 60px;
        width: 380px;
      }
      #controls p {
        margin: 0 0 18px;

        margin: 0 10px 0 0;

        cursor: pointer;

        padding: 14px 18px;
        background: #e6edf9;
        border-radius: 8px;
        cursor: pointer;
        user-select: none;
      }
      .max-height-calc {
        height: auto;
        max-height: calc(100dvh - 50rem);
        width: 425px;
      }
      .flex-1 {

      }
      .overflow-y-auto {

    <script>
      // An independent observer: it records what the *page* received, so the
      // test can assert the macro really produced input.
      window.__emmLog = [];
      window.__emmClicks = [];
      (function () {
        var types = [
          'mousemove',
          'mousedown',
          'mouseup',
          'click',
          'dblclick',
          'contextmenu'
        ];
        var t0 = performance.now();
        types.forEach(function (type) {
          document.addEventListener(
            type,
            function (ev) {
              var entry = {
                type: ev.type,
                x: Math.round(ev.clientX),
                y: Math.round(ev.clientY),
                button: ev.button,
                isTrusted: ev.isTrusted,
                target: ev.target && ev.target.id ? ev.target.id : null,
                t: Math.round(performance.now() - t0)
              };
              window.__emmLog.push(entry);
              if (ev.type === 'click') window.__emmClicks.push(entry);
              var el = document.getElementById('log-count');
              el.textContent = String(window.__emmLog.length);
            },
            true
          );
        });

        document.querySelectorAll('.box').forEach(function (box) {
          box.addEventListener('mousedown', function () {
            box.classList.add('pressed');
          });
          window.addEventListener('mouseup', function () {
            box.classList.remove('pressed');
          });
          box.addEventListener('click', function () {
            box.dataset.clicks = String((Number(box.dataset.clicks) || 0) + 1);
          });
        });

        // Native state of the form controls, plus how many `change` events the
        // page actually received (that is what frameworks hook into).
        var changes = 0;
        var out = document.getElementById('change-count');
        document.getElementById('controls').addEventListener('change', function () {
          changes++;
          out.textContent = 'changes: ' + changes;
        });
        var ids = ['chk-a', 'chk-b', 'radio-1', 'radio-2'];
        window.__emmResetControls = function () {
          ids.forEach(function (id) {
            var el = document.getElementById(id);
            if (el.type === 'checkbox') el.checked = false;
            else el.checked = id === 'radio-1';
          });
          changes = 0;
          out.textContent = 'changes: 0';
        };
        window.__emmState = function () {
          return {
            chkA: document.getElementById('chk-a').checked,
            chkB: document.getElementById('chk-b').checked,
            radio: document.querySelector('input[name="group"]:checked').id,
            changes: changes
          };
        };
      })();
    </script>
